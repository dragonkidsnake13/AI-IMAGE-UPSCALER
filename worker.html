
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelLift Remote Worker</title>
<style>
body{margin:0;padding:24px;background:#0b100e;color:#f1f6f1;font:14px system-ui}
main{max-width:650px;margin:auto}
.panel{background:#141c18;border:1px solid #2a3830;border-radius:14px;padding:18px;margin-top:15px}
textarea{width:100%;height:110px;background:#202a24;color:white;border:1px solid #405247;border-radius:8px;padding:10px;box-sizing:border-box}
button{background:#b8f36b;color:#14200e;padding:11px 15px;border:0;border-radius:8px;font-weight:bold}
.status{color:#b8f36b;margin-top:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>PixelLift Worker</h1>
<p>OPPO remote processing node</p>
<div class="panel">
<h3>Pair with Chromebook</h3>
<textarea id="offer" placeholder="Paste Chromebook offer"></textarea>
<br><br>
<button id="connect">Create answer</button>
<br><br>
<textarea id="answer" readonly placeholder="Copy this answer to Chromebook"></textarea>
<div class="status" id="status">Waiting for connection.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);
ort.env.wasm.numThreads=1;

const models={
 general:{
  url:"https://huggingface.co/skillsafe-ai/realesr-general-x4v3/resolve/042a40bc4c918349ad3e2e607a68ae509a4c27b5/model.onnx",
  input:"input",output:"output"
 },
 x4plus:{
  url:"https://huggingface.co/skillsafe-ai/realesrgan-x4plus/resolve/main/model.onnx",
  input:"input",output:"output"
 },
 swinir:{
  url:"https://huggingface.co/Heliosoph/swinir-onnx/resolve/main/swinir_realsr_x4.onnx",
  input:"image",output:"upscaled"
 }
};

let pc,channel;
let sessions=new Map();
let incoming=null;
let task=null;
let chunkSize=16000;
let counter=0;

function say(s){$("status").textContent=s}

function waitICE(peer){
 return new Promise((resolve,reject)=>{
  if(peer.iceGatheringState==="complete")return resolve();
  const timer=setTimeout(()=>reject(Error("ICE gathering timed out")),20000);
  peer.addEventListener("icegatheringstatechange",()=>{
   if(peer.iceGatheringState==="complete"){
    clearTimeout(timer);resolve();
   }
  });
 });
}

$("connect").onclick=async()=>{
 try{
  say("Creating connection...");
  pc=new RTCPeerConnection({iceServers:[]});

  pc.ondatachannel=e=>{
   channel=e.channel;
   channel.binaryType="arraybuffer";

   channel.onopen=()=>{
    say("Connected to Chromebook.");
    channel.send(JSON.stringify({
     type:"hello",
     webgpu:!!navigator.gpu
    }));
   };

   channel.onmessage=receive;
  };

  await pc.setRemoteDescription(JSON.parse($("offer").value));
  await pc.setLocalDescription(await pc.createAnswer());
  await waitICE(pc);

  $("answer").value=JSON.stringify(pc.localDescription);
  say("Answer created. Copy it to Chromebook.");
 }catch(e){say("Connection error: "+e.message)}
};

async function receive(event){
 if(typeof event.data==="string"){
  let m;
  try{m=JSON.parse(event.data)}catch{return}

  if(m.type==="task"){
   incoming={
    id:m.id,
    model:m.model,
    engine:m.engine,
    size:m.size,
    chunks:[]
   };
  }
  return;
 }

 if(!incoming)return;

 const packet=new Uint8Array(event.data);
 const sequence=new DataView(
  packet.buffer,packet.byteOffset,4
 ).getUint32(0);

 incoming.chunks[sequence]=packet.slice(4);
 incoming.received=(incoming.received||0)+packet.length-4;

 if(incoming.received>=incoming.size){
  const completed=incoming;
  incoming=null;
  try{await processTile(completed)}
  catch(e){
   channel.send(JSON.stringify({
    type:"error",id:completed.id,message:e.message
   }));
   say("Tile error: "+e.message);
  }
 }
}

async function getSession(key,engine){
 const model=models[key];
 const cacheKey=key+":"+engine;
 if(sessions.has(cacheKey))return sessions.get(cacheKey);

 const promise=ort.InferenceSession.create(model.url,{
  executionProviders:engine==="webgpu"?["webgpu"]:["wasm"],
  graphOptimizationLevel:"all",
  enableCpuMemArena:false
 });

 sessions.set(cacheKey,promise);
 try{return await promise}
 catch(e){sessions.delete(cacheKey);throw e}
}

function tensorFromImage(canvas){
 const pixels=canvas.getContext("2d",{
  willReadFrequently:true
 }).getImageData(0,0,canvas.width,canvas.height).data;

 const n=canvas.width*canvas.height;
 const data=new Float32Array(n*3);

 for(let i=0;i<n;i++){
  data[i]=pixels[i*4]/255;
  data[n+i]=pixels[i*4+1]/255;
  data[2*n+i]=pixels[i*4+2]/255;
 }

 return new ort.Tensor("float32",data,
  [1,3,canvas.height,canvas.width]);
}

function tensorToCanvas(t){
 if(t.dims.length!==4||t.dims[1]!==3)
  throw Error("Unexpected model output.");

 const w=t.dims[3],h=t.dims[2],n=w*h;
 const canvas=document.createElement("canvas");
 canvas.width=w;canvas.height=h;

 const ctx=canvas.getContext("2d");
 const image=ctx.createImageData(w,h);

 for(let i=0;i<n;i++){
  image.data[i*4]=Math.max(0,Math.min(255,t.data[i]*255));
  image.data[i*4+1]=Math.max(0,Math.min(255,t.data[n+i]*255));
  image.data[i*4+2]=Math.max(0,Math.min(255,t.data[2*n+i]*255));
  image.data[i*4+3]=255;
 }

 ctx.putImageData(image,0,0);
 return canvas;
}

async function processTile(job){
 const chunks=job.chunks;
 const total=chunks.reduce((s,c)=>s+c.length,0);
 const bytes=new Uint8Array(total);
 let offset=0;

 for(const chunk of chunks){
  bytes.set(chunk,offset);
  offset+=chunk.length;
 }

 const bitmap=await createImageBitmap(
  new Blob([bytes],{type:"image/png"})
 );

 const source=document.createElement("canvas");
 source.width=bitmap.width;
 source.height=bitmap.height;
 source.getContext("2d").drawImage(bitmap,0,0);
 bitmap.close?.();

 const model=models[job.model];
 let engine=job.engine==="wasm"?"wasm":"webgpu";
 let session;

 try{
  session=await getSession(job.model,engine);
 }catch(e){
  if(job.engine==="webgpu")throw e;
  engine="wasm";
  session=await getSession(job.model,"wasm");
 }

 say("Processing tile using "+engine.toUpperCase());

 const input=tensorFromImage(source);
 let result;

 try{
  result=await session.run({[model.input]:input});
  const output=result[model.output];
  const canvas=tensorToCanvas(output);

  const blob=await new Promise((resolve,reject)=>{
   canvas.toBlob(b=>b?resolve(b):reject(Error("Tile encoding failed")),"image/png");
  });

  await sendResult(blob,job.id);
  canvas.width=canvas.height=1;
 }finally{
  input.dispose?.();
  if(result)Object.values(result).forEach(t=>t.dispose?.());
  source.width=source.height=1;
 }

 counter++;
 say("Completed remote tiles: "+counter);
}

async function sendResult(blob,id){
 channel.send(JSON.stringify({
  type:"result",
  id,
  size:blob.size
 }));

 for(let offset=0,sequence=0;offset<blob.size;offset+=chunkSize,sequence++){
  while(channel.bufferedAmount>500000){
   await new Promise(r=>setTimeout(r,20));
  }

  const part=new Uint8Array(
   await blob.slice(offset,offset+chunkSize).arrayBuffer()
  );

  const packet=new Uint8Array(part.length+4);
  new DataView(packet.buffer).setUint32(0,sequence);
  packet.set(part,4);
  channel.send(packet);
 }
}
</script>
</body>
</html>
